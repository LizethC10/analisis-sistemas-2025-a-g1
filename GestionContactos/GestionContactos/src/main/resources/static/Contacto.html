<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Contactos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #444;
        }

        button {
            padding: 10px;
            margin: 10px 0;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        #contactosList {
            margin-top: 20px;
            padding: 10px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        #formularioContacto {
            margin-top: 20px;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #saveButton {
            margin-top: 20px;
            background-color: #008CBA;
        }

        #saveButton:hover {
            background-color: #007bb5;
        }

        #cancelButton {
            margin-top: 10px;
            background-color: #f44336;
            color: white;
        }

        #cancelButton:hover {
            background-color: #e41f1f;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: white;
            background-color: #f44336;
            padding: 10px 15px;
            border-radius: 4px;
        }

        a:hover {
            background-color: #e41f1f;
        }
    </style>
</head>
<body>
    <h1>Mis Contactos</h1>

    <!-- Botón para agregar un nuevo contacto -->
    <button id="btnAgregar">Agregar Contacto</button>
    <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let contacto of contactos">
            <td>{{ contacto.id }}</td>
            <td>{{ contacto.nombre }}</td>
            <td>{{ contacto.email }}</td>
            <td>
              <button (click)="editarContacto(contacto)">Editar</button>
              <button (click)="eliminarContacto(contacto.id)">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
    
    <!-- Contenedor donde se mostrarán los contactos -->
    <div id="contactosList">
        <p>No hay contactos aún.</p>
    </div>
    
    <!-- Formulario para agregar o editar contacto -->
    <div id="formularioContacto" style="display: none;">
        <h3 id="formTitle">Agregar/Editar Contacto</h3>
        <form id="contactoForm">
            <label for="nombres">Nombres:</label>
            <input type="text" id="nombres" required>

            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" required>

            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" required>

            <button type="submit" id="saveButton">Guardar</button>
            <button type="button" id="cancelButton">Cancelar</button>


        </form>
    </div>

    <a href="Usuario.html">Cerrar sesión</a>

    <script src="Contacto.js"></script>
</body>
</html>
